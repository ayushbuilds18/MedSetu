services:
  - type: web
    name: medsetu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medsetu-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: MEDSETU_ADMIN_USERNAME
        sync: false
      - key: MEDSETU_ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: medsetu-db
    databaseName: medsetu
    user: medsetu
    plan: free
